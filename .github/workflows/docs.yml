name: Public site

# PR and main checks are selected by CI; this entry point publishes manually.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the checked site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docs-check.yml
    with:
      upload: ${{ inputs.deploy && github.ref == 'refs/heads/main' }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
