name: Public site

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "apps/server/src/http/openapi/openapi.json"
      - "apps/server/src/core/config.ts"
      - "apps/server/src/core/settings.ts"
      - "apps/server/src/modules/**/settings.ts"
      - "apps/server/src/modules/settings.ts"
      - "packages/shared/src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/server/src/http/openapi/openapi.json"
      - "apps/server/src/core/config.ts"
      - "apps/server/src/core/settings.ts"
      - "apps/server/src/modules/**/settings.ts"
      - "apps/server/src/modules/settings.ts"
      - "packages/shared/src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the checked site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  SITE_URL: ${{ vars.SITE_URL || 'https://merran.app' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --filter @merran/docs...
      - run: pnpm --filter @merran/docs typecheck
      - run: pnpm --filter @merran/docs test
      - run: pnpm exec prettier --check apps/docs
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/docs/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
