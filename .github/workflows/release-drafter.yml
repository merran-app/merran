name: Release Drafter

# Keeps the next release's draft up to date as pull requests merge into
# main, from .github/release-drafter.yml. Release publishes it.
#
# Each run writes the draft's notes afresh, so write the highlights just
# before running Release; Release keeps the notes as they were when it
# started.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  draft:
    name: Draft the next release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
