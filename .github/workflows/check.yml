name: Check

# Release uses the defaults to run every check. CI selects affected packages.
on:
  workflow_call:
    inputs:
      server:
        type: boolean
        default: true
      web:
        type: boolean
        default: true
      extension:
        type: boolean
        default: true
      shared:
        type: boolean
        default: true
      telemetry:
        type: boolean
        default: true
      docs:
        type: boolean
        default: true
      extension-build:
        description: Release builds versioned ZIPs separately
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  server:
    if: inputs.server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: merran
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MERRAN_TEST_POSTGRES_URL: postgres://postgres:merran@localhost:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          package: "@merran/server"
      - run: pnpm exec prettier --check apps/server
      - run: pnpm --filter @merran/server typecheck
      - run: pnpm --filter @merran/server test:all

  web:
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          package: "@merran/web"
      - run: pnpm exec prettier --check apps/web
      - run: pnpm --filter @merran/web typecheck
      - run: pnpm --filter @merran/web check:contrast
      - run: pnpm --filter @merran/web build
      - run: pnpm --filter @merran/web test
      - run: pnpm --filter @merran/web api
      - name: Check generated files are committed
        run: |
          git diff --exit-code -- apps/web/src/lib/api/schema.d.ts apps/web/src/routeTree.gen.ts
          diff -q apps/web/src/lib/api/schema.d.ts apps/extension/src/lib/schema.d.ts

  extension:
    if: inputs.extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          package: "@merran/extension"
      - run: pnpm exec prettier --check apps/extension
      - run: pnpm --filter @merran/extension typecheck
      - if: inputs.extension-build
        run: pnpm --filter @merran/extension build
      - if: inputs.extension-build
        run: pnpm --filter @merran/extension build:firefox

  shared:
    if: inputs.shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          package: "@merran/shared"
      - run: pnpm exec prettier --check packages/shared
      - run: pnpm --filter @merran/shared typecheck
      - run: pnpm --filter @merran/shared test

  telemetry:
    if: inputs.telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          package: "@merran/telemetry"
      - run: pnpm exec prettier --check apps/telemetry
      - run: pnpm --filter @merran/telemetry typecheck
      - run: pnpm --filter @merran/telemetry test

  docs:
    if: inputs.docs
    uses: ./.github/workflows/docs-check.yml

  check:
    name: Check and test
    if: always()
    needs: [server, web, extension, shared, telemetry, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node .github/scripts/gate.mjs
        env:
          CI_GATE_RESULTS: ${{ toJSON(needs) }}
          CI_GATE_EXPECTED: >-
            {"server": ${{ inputs.server }}, "web": ${{ inputs.web }}, "extension": ${{ inputs.extension }}, "shared": ${{ inputs.shared }}, "telemetry": ${{ inputs.telemetry }}, "docs": ${{ inputs.docs }}}
