name: Telemetry receiver

# Deploys the telemetry receiver (apps/telemetry) to Cloudflare whenever main
# changes it, so it always takes what the next release sends
# (docs/telemetry.md, "Deploying from CI"). Pull requests are checked by CI.
# It waits for the Cloudflare setup in apps/telemetry/README.md: until the
# repository variable TELEMETRY_DEPLOY is "true", it does nothing.

on:
  push:
    branches: [main]
    paths:
      - "apps/telemetry/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".npmrc"
      - "tsconfig.base.json"
      - ".github/actions/setup/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    if: vars.TELEMETRY_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: telemetry
      url: https://telemetry.merran.app/v1/totals
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          package: "@merran/telemetry"
      - run: pnpm --filter @merran/telemetry typecheck
      - run: pnpm --filter @merran/telemetry test
      # The database's migrations first, then the Worker that uses them.
      - run: pnpm --filter @merran/telemetry run deploy
