name: Release

# A release of Merran (docs/operations.md, "Releases and updates"), run by
# hand from main with its version: every check, then the Docker image for
# amd64 and arm64, signed, with its SBOM and provenance; the browser
# extension's zips; and the GitHub release, tagged v<version>.
#
# The release is the draft Release Drafter keeps (release-drafter.yml), with
# the highlights written in it, published last, once the images exist: every
# Merran's update check sees it the moment it's published. Without a draft,
# GitHub writes notes from the pull requests.
#
# Image tags: the version itself (0.1.0-alpha.1, 0.4.2), which never moves,
# and `next`, the newest release of any kind. A release that isn't a
# pre-release also moves 0.4 and `latest` (and 1, from 1.0 on).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, without a v: 0.1.0-alpha.1, or 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: The version and notes
    runs-on: ubuntu-latest
    permissions:
      # Only a token that can write releases sees drafts. This job only
      # reads the draft.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      stable-major: ${{ steps.version.outputs.stable-major }}
      draft: ${{ steps.notes.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION isn't a version like 0.1.0-alpha.1 or 0.1.0."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is released already."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # A major-version tag (1, 2) only from 1.0 on, and only for releases.
          if [[ "$VERSION" != *-* && "$VERSION" != 0.* ]]; then
            echo "stable-major=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable-major=false" >> "$GITHUB_OUTPUT"
          fi
      # The draft's notes, taken now, before anything's built: a merge
      # during the build writes the draft afresh, without the highlights.
      - id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft)] | sort_by(.created_at) | last | .id // empty')
          mkdir -p notes
          echo > notes/draft.md
          if [ -n "$draft" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$draft" --jq '.body // ""' > notes/draft.md
            if grep -qF "Write the highlights here" notes/draft.md; then
              echo "::error::The draft release still says \"Write the highlights here\". Write them, or delete that section, then run Release again."
              exit 1
            fi
            # The first release's draft, with no earlier release to compare.
            if grep -qF "could not find a previous" notes/draft.md; then
              echo "::error::The draft release still has Release Drafter's warning about a previous release. Write its notes, delete the warning, then run Release again."
              exit 1
            fi
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/draft.md

  check:
    needs: version
    uses: ./.github/workflows/check.yml
    with:
      extension-build: false

  image:
    name: Docker image
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For cosign's keyless signing, with GitHub's identity for this run.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=next
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ needs.version.outputs.stable-major == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: MERRAN_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signed by digest, so every tag of it is covered: anyone can check it
      # was built here, by this workflow, from this repo.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

  extension:
    name: Browser extension
    needs: [version, check]
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          package: "@merran/extension"
      # The release's version: WXT gives the browsers its numbers (0.1.0),
      # and Chrome shows the rest (0.1.0-alpha.1).
      - run: npm pkg set version="$VERSION"
        working-directory: apps/extension
      - run: pnpm --filter @merran/extension zip
      # WXT writes the zips to .output, which upload-artifact counts as
      # hidden and leaves out unless told otherwise.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: apps/extension/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, image, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      DRAFT: ${{ needs.version.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: extension
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > getting.md <<EOF
          ## Getting it

          \`\`\`bash
          docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION}
          \`\`\`

          With the compose file in the repo, \`docker compose pull && docker compose up -d\`. The browser extension's zips are below: load the one for your browser as an unpacked extension (see apps/extension/README.md).

          The image is signed: \`cosign verify ghcr.io/${GITHUB_REPOSITORY}:${VERSION} --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`
          EOF
          if [ -z "$DRAFT" ]; then
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "v$VERSION" extension/*.zip \
              --target "$GITHUB_SHA" \
              --title "Merran $VERSION" \
              --notes-file getting.md \
              --generate-notes \
              "${flags[@]}"
            exit 0
          fi
          # The draft's notes, then how to get it, then everything since the
          # last release.
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not)] | sort_by(.published_at) | last | .tag_name // empty')
          {
            cat notes/draft.md
            printf '\n\n'
            cat getting.md
            if [ -n "$previous" ]; then
              printf '\n**Full changelog:** https://github.com/%s/compare/%s...v%s\n' \
                "$GITHUB_REPOSITORY" "$previous" "$VERSION"
            fi
          } > notes.md
          # The draft becomes this release, still a draft while the zips go
          # on, then it's published, which tags this commit.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Merran $VERSION" \
            -F body=@notes.md \
            -F prerelease="$PRERELEASE" > /dev/null
          gh release upload "v$VERSION" extension/*.zip --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT" -F draft=false > /dev/null
