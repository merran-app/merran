name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
      web: ${{ steps.changes.outputs.web }}
      extension: ${{ steps.changes.outputs.extension }}
      shared: ${{ steps.changes.outputs.shared }}
      telemetry: ${{ steps.changes.outputs.telemetry }}
      docs: ${{ steps.changes.outputs.docs }}
      image: ${{ steps.changes.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node --test .github/scripts/*.test.mjs
      - id: changes
        run: node .github/scripts/changes.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}

  check:
    needs: changes
    uses: ./.github/workflows/check.yml
    with:
      server: ${{ needs.changes.outputs.server == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
      extension: ${{ needs.changes.outputs.extension == 'true' }}
      shared: ${{ needs.changes.outputs.shared == 'true' }}
      telemetry: ${{ needs.changes.outputs.telemetry == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}

  pr-image:
    name: PR image
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/image.yml

  edge-image:
    name: Publish edge
    needs: [changes, check]
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      publish: true

  passed:
    name: CI passed
    if: always()
    needs: [changes, check, pr-image, edge-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node .github/scripts/gate.mjs
        env:
          CI_GATE_RESULTS: ${{ toJSON(needs) }}
          CI_GATE_EXPECTED: >-
            {"changes": true, "check": true,
             "pr-image": ${{ github.event_name == 'pull_request' && needs.changes.outputs.image == 'true' }},
             "edge-image": ${{ github.event_name == 'push' && needs.changes.outputs.image == 'true' }}}
