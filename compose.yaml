# Merran. Put this file in a folder (with .env.example copied to .env, if you
# want to change anything), then:
#
#   docker compose up -d                       on SQLite: nothing to set
#   docker compose --profile postgres up -d    on Postgres: set POSTGRES_PASSWORD
#                                              and DATABASE_URL in .env first
#
# Add --profile voice for Kokoro, a voice for the cook view, and --profile
# tunnel for a Cloudflare Tunnel; more than one profile works too.
# Or save COMPOSE_PROFILES=postgres,voice in .env to keep those services
# included in later commands. See the installation guide for complete setup.
#
# Everything Merran keeps is in ./data, next to this file. Back that up.

services:
  merran:
    # next: the newest release, pre-releases included. latest: the newest
    # 0.1 or later, once there is one. edge: every commit to main, for
    # testers. Use next during alpha; latest becomes the recommended tag
    # with the first full release. Set a specific release tag to pin a version.
    image: ${MERRAN_IMAGE:-ghcr.io/merran-app/merran:next}
    restart: unless-stopped
    ports:
      - "${MERRAN_PORT:-3000}:3000"
    volumes:
      - ./data/app:/data
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:18
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: merran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: merran
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql, not .../data.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merran -d merran"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kokoro, an open voice model, reads cook steps aloud: free, the same on
  # every device, and nothing leaves the server. It needs 1 to 2 GB of RAM.
  # Then set its address, http://kokoro:8880, in Settings → This server →
  # Voice (or MERRAN_KOKORO_URL in .env).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: [voice]
    restart: unless-stopped
    # No published ports: only Merran talks to it.

  # A Cloudflare Tunnel, for reaching Merran from outside without opening a
  # port. Make a tunnel in Cloudflare's dashboard, point its public hostname
  # at http://merran:3000, and set CLOUDFLARE_TUNNEL_TOKEN (and
  # MERRAN_PUBLIC_URL) in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - merran
